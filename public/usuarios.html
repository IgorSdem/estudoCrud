<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.topo{
background:#e5e7eb;
padding:32px;
border-radius:5px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
gap:16px;
align-items:center;
}

.topo a{
color:#0d6efd;
font-weight:bold;
text-decoration:none;
}

.acoes{
display:flex;
gap:15px;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.btn{
padding:10px 15px;
border:none;
border-radius:4px;
cursor:pointer;
color:white;
text-decoration:none;
font-size:14px;
display:inline-block;
}

.btn-add{
background:#28a745;
}

.btn-filtrar,
.btn-info{
background:#0d6efd;
}

.btn-update{
background:#ffc107;
color:black;
}

.btn-delete{
background:#dc3545;
}

input{
padding:10px;
width:280px;
border:1px solid #ccc;
border-radius:4px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f8f9fa;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-top:1px solid #ddd;
}

tr:nth-child(even){
background:#f2f2f2;
}

.mensagem{
padding:16px;
text-align:center;
color:#555;
}

.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
padding:20px;
border-radius:8px;
width:400px;
max-width:100%;
}

.fechar{
float:right;
cursor:pointer;
font-size:20px;
}

@media(max-width:700px){
.topo{
align-items:flex-start;
flex-direction:column;
}

table{
font-size:14px;
}

th,
td{
padding:8px;
}
}
</style>
</head>

<body>
<div class="container">
<div class="topo">
<h1>Usuários</h1>
<a href="/logout">Sair</a>
</div>

<div class="acoes">
<a class="btn btn-add" href="/cadastroUsuario.html">Adicionar</a>

<input
type="text"
id="filtro"
placeholder="Buscar por nome ou e-mail"
oninput="filtrarUsuarios()">

<button
class="btn btn-filtrar"
onclick="filtrarUsuarios()">
Filtrar
</button>
</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nome</th>
<th>Email</th>
<th>Nível</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="tabelaUsuarios">
<tr>
<td colspan="5" class="mensagem">Carregando usuários...</td>
</tr>
</tbody>
</table>

<br>

<a href="/painel.html">← Voltar ao Painel</a>
</div>

<div class="modal" id="modalInfo">
<div class="modal-content">
<span class="fechar" onclick="fecharModal()">×</span>
<h2>Dados do Usuário</h2>
<div id="dadosUsuario"></div>
</div>
</div>

<script>
let usuarios = [];

async function carregarUsuarios(){
try{
const resposta = await fetch('/api/usuarios');

if(!resposta.ok){
throw new Error('Erro ao carregar usuários');
}

usuarios = await resposta.json();
renderizarTabela(usuarios);
}catch(e){
console.error(e);
document.getElementById('tabelaUsuarios').innerHTML = `
<tr>
<td colspan="5" class="mensagem">Não foi possível carregar os usuários.</td>
</tr>
`;
}
}

function renderizarTabela(lista){
const tabela = document.getElementById('tabelaUsuarios');

if(lista.length === 0){
tabela.innerHTML = `
<tr>
<td colspan="5" class="mensagem">Nenhum usuário encontrado.</td>
</tr>
`;
return;
}

let html = '';

lista.forEach(usuario=>{
html += `
<tr>
<td>${usuario.id}</td>
<td>${usuario.nome}</td>
<td>${usuario.email}</td>
<td>${usuario.is_admin == 1 ? 'Administrador' : 'Usuário'}</td>
<td>
<button class="btn btn-info" onclick="mostrarInfo(${usuario.id})">Exibir</button>
<button class="btn btn-update" onclick="atualizarUsuario(${usuario.id})">Atualizar</button>
<button class="btn btn-delete" onclick="excluirUsuario(${usuario.id})">Excluir</button>
</td>
</tr>
`;
});

tabela.innerHTML = html;
}

function filtrarUsuarios(){
const termo = document.getElementById('filtro').value.toLowerCase().trim();

const resultado = usuarios.filter(usuario =>
usuario.nome.toLowerCase().includes(termo) ||
usuario.email.toLowerCase().includes(termo)
);

renderizarTabela(resultado);
}

async function mostrarInfo(id){
const resposta = await fetch(`/api/usuarios/${id}`);

if(!resposta.ok){
alert('Erro ao buscar usuário.');
return;
}

const usuario = await resposta.json();

document.getElementById('dadosUsuario').innerHTML = `
<p><b>ID:</b> ${usuario.id}</p>
<p><b>Nome:</b> ${usuario.nome}</p>
<p><b>Email:</b> ${usuario.email}</p>
<p><b>Administrador:</b> ${usuario.is_admin == 1 ? 'Sim' : 'Não'}</p>
`;

document.getElementById('modalInfo').style.display = 'flex';
}

function fecharModal(){
document.getElementById('modalInfo').style.display = 'none';
}

function atualizarUsuario(id){
window.location.href = 'atualizarUsuario.html?id=' + id;
}

async function excluirUsuario(id){
const respostaUsuario = await fetch(`/api/usuarios/${id}`);

if(!respostaUsuario.ok){
alert('Erro ao buscar usuário.');
return;
}

const usuario = await respostaUsuario.json();

const confirmar = confirm(`Deseja excluir este usuário?\n\nNome: ${usuario.nome}\nEmail: ${usuario.email}`);

if(!confirmar){
return;
}

const respostaExclusao = await fetch(`/api/usuarios/${id}`, {
method:'DELETE'
});

if(!respostaExclusao.ok){
const erro = await respostaExclusao.json().catch(() => ({ erro: 'Erro ao excluir usuário.' }));
alert(erro.erro || 'Erro ao excluir usuário.');
return;
}

alert('Usuário excluído com sucesso!');
carregarUsuarios();
}

carregarUsuarios();
</script>
</body>
</html>
