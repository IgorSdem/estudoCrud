<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="cadastraUsuario.css">
</head>
<body>
    <div class="cadastro-container">
        <h2>Criar Nova Conta</h2>
        <p>Preencha os campos abaixo para cadastrar um usuário no sistema.</p>

        <form action="/cadastrar" method="POST" id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" minlength="3" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" minlength="6" required>
            </div>

            <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" minlength="6" required>
            </div>

            <button type="submit" class="btn-enviar">Cadastrar no Sistema</button>
        </form>

        <br>
        <a href="/usuarios">Voltar para lista</a>
    </div>

    <script>
        const form = document.getElementById('formCadastro');

        form.addEventListener('submit', function(event) {
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (senha !== confirmarSenha) {
                event.preventDefault();
                alert('As senhas não coincidem.');
            }
        });
    </script>
</body>
</html>
