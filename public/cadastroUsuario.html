<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="cadastraUsuario.css">
</head>
<body>
    <div class="cadastro-container">
        <h2>Criar Nova Conta</h2>
        <p>Preencha os campos abaixo para se cadastrar no sistema.</p>

        <form action="/cadastrar" method="POST" id="formCadastro">
            
            <div class="input-group" id="teste">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" minlength="6" required>
            </div>

            <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" required>
            </div>

            <button type="submit" class="btn-enviar">Cadastrar no Sistema</button>
          
        </form>
    </div>

    <script>
        // Validação simples no client-side para garantir que as senhas são iguais antes de enviar ao banco
        const form = document.getElementById('formCadastro');
        form.addEventListener('submit', function(event) {
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (senha !== confirmarSenha) {
                event.preventDefault(); // Impede o envio do formulário
                alert('As senhas não coincidem!');
            }
        });
    </script>
</body>
</html>
