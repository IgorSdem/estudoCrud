<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar Usuário</title>
    <link rel="stylesheet" href="cadastraUsuario.css">
</head>
<body>
    <div class="cadastro-container">
        <h2 class="titulo-perigo">Excluir Usuário</h2>
        <p>Atenção: esta ação é permanente. Informe o e-mail do usuário que deseja remover do sistema.</p>

        <form action="/deletar" method="POST" onsubmit="return confirmarExclusao();">
            <div class="input-group">
                <label for="emailDeletar">E-mail do Usuário</label>
                <input type="email" id="emailDeletar" name="emailDeletar" placeholder="usuario@gmail.com" required>
            </div>

            <button type="submit" class="btn-enviar btn-perigo">Deletar do Sistema</button>
        </form>

        <br>
        <a href="/usuarios">Voltar para lista</a>
    </div>

    <script>
        function confirmarExclusao() {
            const email = document.getElementById('emailDeletar').value;
            return confirm(`Tem certeza que deseja deletar o usuário ${email}?`);
        }
    </script>
</body>
</html>
